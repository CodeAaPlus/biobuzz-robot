# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# We no longer need to auto-convert third-party libraries to use AndroidX, which slowed down the build
android.enableJetifier=false

# Build budget for this 30 GiB / 16-thread workstation:
# Leave headroom within half of system RAM for native memory and worker processes.
org.gradle.jvmargs=-Xmx10g
# Limit worker concurrency; this is not a strict CPU utilization cap.
org.gradle.workers.max=8

# Reuse eligible task outputs from previous builds.
org.gradle.caching=true
# Reuse the configured task graph between compatible builds.
org.gradle.configuration-cache=true

android.nonTransitiveRClass=false
